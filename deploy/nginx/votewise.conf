# sudo ln -s /etc/nginx/sites-available/votewise /etc/nginx/sites-enabled/votewise
# sudo nginx -t && sudo systemctl reload nginx
# sudo certbot --nginx -d votewise.sautistack.africa -d www.votewise.sautistack.africa
# Port must match WEB_HOST_PORT in .env.

server {
  listen 80;
  server_name www.votewise.sautistack.africa;
  return 301 https://votewise.sautistack.africa$request_uri;
}

server {
  listen 80;
  server_name votewise.sautistack.africa;
  client_max_body_size 5m;

  location / {
    proxy_pass http://127.0.0.1:18083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
